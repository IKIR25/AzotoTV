# An example ~/.config/sunshine/sunshine.conf for game streaming (see
# src-tauri/src/stream.rs). `azototv --system` prints this machine's screens
# with their GPUs' render nodes and encoders.
#
# This one is for a laptop under the TV with two GPUs: Sunshine streams the
# laptop's own screen (never off, see stream.rs), which the integrated GPU
# scans out, so capture and encode both happen there (the other GPU can't
# import its frames).
capture = kms
# by index among that GPU's screens (0 = the first): by name Sunshine counts
# the other GPU's screens too and looks for the wrong one
output_name = 0
encoder = vaapi
adapter_name = /dev/dri/by-path/pci-0000:00:02.0-render
