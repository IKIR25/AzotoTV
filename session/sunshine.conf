# -> server ~/.config/sunshine/sunshine.conf (see src-tauri/src/stream.rs)
locale = it
# the laptop panel (never off, see stream.rs), scanned out by the Intel iGPU:
# capture and encode both there (the NVIDIA can't import its tiled frames)
capture = kms
# by index: KMS numbering on the Intel only, where the panel is 0; by name
# Sunshine counts the TV too (on the NVIDIA) and looks for the wrong index
output_name = 0
encoder = vaapi
adapter_name = /dev/dri/by-path/pci-0000:00:02.0-render
