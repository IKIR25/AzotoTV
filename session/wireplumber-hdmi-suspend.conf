# AzotoTV: the TV's HDMI output (NVIDIA HDA) sleeps 1 s after the last sound
# instead of WirePlumber's 5 s. While it's awake the CPU package can't reach its
# deep idle state (~2 -> ~8.5 W), and the interface sounds wake it at every move.
# Installed as ~/.config/wireplumber/wireplumber.conf.d/51-azototv-hdmi-suspend.conf
# (then `systemctl --user restart wireplumber`).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.pci-0000_01_00.1.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 1 } }
  }
]
