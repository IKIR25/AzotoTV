# AzotoTV (optional): HDMI sound outputs sleep 1 s after the last sound instead
# of WirePlumber's 5 s. While an NVIDIA's HDMI audio is awake the CPU package
# can't reach its deep idle state (~2 -> ~8.5 W measured on a laptop), and the
# interface sounds wake it at every move.
# Installed as ~/.config/wireplumber/wireplumber.conf.d/51-azototv-hdmi-suspend.conf
# (then `systemctl --user restart wireplumber`).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*hdmi.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 1 } }
  }
]
