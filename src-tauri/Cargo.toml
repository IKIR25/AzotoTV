[package]
name = "azototv"
version = "0.1.0"
description = "A TV interface for a home server: Jellyfin, live TV, YouTube, music, photos and games, driven with a controller"
authors = ["IKIR25"]
license = "MIT"
repository = "https://github.com/IKIR25/AzotoTV"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "azototv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "process", "sync", "rt", "macros", "fs"] }
gilrs = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
azotopad = { version = "0.1.0", path = "../crates/azotopad" }
# TV remotes (remote.rs)
evdev = "0.13.2"
libc = "0.2.191"
md-5 = "0.10"
# profile PINs (profile.rs); already built for rustls
ring = "0.17"
flate2 = "1"
base64 = "0.22"
# the TV's MQTT broker (tv.rs); the same rustls / ring as reqwest's
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# interface sounds (sound.rs)
cpal = "0.15"
# the phone companion's web server and pairing QR code (phone.rs)
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "json", "query"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# the WebKitGTK engine wry already uses (same version), for its cache settings
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
# the notification overlay (same GTK as tao / wry)
gtk = "0.18"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
