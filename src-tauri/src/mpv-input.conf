# AzotoTV: every action is routed to azoto-osd.lua, which owns the on-screen UI.
# mpv's default bindings are disabled, so keyboard equivalents are listed too.
# Format: KEY [prefix] command   (comments only on their own lines)

# A: confirm / pause
GAMEPAD_ACTION_DOWN             script-message azoto-input a
# B: back / stop
GAMEPAD_ACTION_RIGHT            script-message azoto-input b
GAMEPAD_BACK                    script-message azoto-input b
# X: audio menu, Y: subtitle menu
GAMEPAD_ACTION_LEFT             script-message azoto-input x
GAMEPAD_ACTION_UP               script-message azoto-input y
GAMEPAD_START                   script-message azoto-input start
GAMEPAD_MENU                    script-message azoto-input start
GAMEPAD_DPAD_UP                 repeatable script-message azoto-input up
GAMEPAD_DPAD_DOWN               repeatable script-message azoto-input down
GAMEPAD_DPAD_LEFT               repeatable script-message azoto-input left
GAMEPAD_DPAD_RIGHT              repeatable script-message azoto-input right
GAMEPAD_LEFT_STICK_UP           repeatable script-message azoto-input up
GAMEPAD_LEFT_STICK_DOWN         repeatable script-message azoto-input down
GAMEPAD_LEFT_STICK_LEFT         repeatable script-message azoto-input left
GAMEPAD_LEFT_STICK_RIGHT        repeatable script-message azoto-input right
GAMEPAD_LEFT_SHOULDER           repeatable script-message azoto-input lb
GAMEPAD_RIGHT_SHOULDER          repeatable script-message azoto-input rb

SPACE                           script-message azoto-input a
ENTER                           script-message azoto-input a
ESC                             script-message azoto-input b
BS                              script-message azoto-input b
x                               script-message azoto-input x
y                               script-message azoto-input y
TAB                             script-message azoto-input start
UP                              repeatable script-message azoto-input up
DOWN                            repeatable script-message azoto-input down
LEFT                            repeatable script-message azoto-input left
RIGHT                           repeatable script-message azoto-input right
PGUP                            repeatable script-message azoto-input lb
PGDWN                           repeatable script-message azoto-input rb
q                               quit
F11                             cycle fullscreen
f                               cycle fullscreen

# the mouse: click = A, double click = full screen, right click = START (the
# bar), wheel = volume (or moves in a menu), side "back" button = B
MBTN_LEFT                       script-message azoto-input a
MBTN_LEFT_DBL                   cycle fullscreen
MBTN_RIGHT                      script-message azoto-input start
MBTN_BACK                       script-message azoto-input b
WHEEL_UP                        script-message azoto-input wheelup
WHEEL_DOWN                      script-message azoto-input wheeldown
